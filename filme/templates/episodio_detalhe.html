{% extends 'base.html' %}
{% block content %}

<div class="container text-center mt-5">
    <h2>{{ object.titulo }}</h2>
    <div class="ratio ratio-16x9 mt-3">
        <iframe width="100%" height="500"
                src="{{ object.video }}"
                title="{{ object.titulo }}"
                frameborder="0"
                allowfullscreen></iframe>
    </div>
    <a href="{% url 'filme:detalhesfilme' object.filme.pk %}" class="btn btn-primary mt-4">Voltar ao Filme</a>
</div>

{% endblock %}
