{% extends 'base.html' %}
{% load static %}

{% block titulo %}
Editar Perfil
{% endblock %}

{% block content %}

<div class="flex justify-center items-center py-24 bg-gray-900">

    <div class="bg-gray-800 p-10 rounded-2xl shadow-xl w-full max-w-xl border border-gray-700">

        <h2 class="text-3xl font-bold text-red-500 text-center mb-6">
            Editar Perfil
        </h2>

        <p class="text-gray-300 text-center mb-6">
            Atualize suas informações abaixo.
        </p>

        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}

            <!-- Campo Nome -->
            <div>
                <label class="block text-gray-300 mb-1 font-semibold">Nome</label>
                <input type="text" name="first_name" value="{{ user.first_name }}"
                       class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-red-500">
            </div>

            <!-- Campo Sobrenome -->
            <div>
                <label class="block text-gray-300 mb-1 font-semibold">Sobrenome</label>
                <input type="text" name="last_name" value="{{ user.last_name }}"
                       class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-red-500">
            </div>

            <!-- Campo Email -->
            <div>
                <label class="block text-gray-300 mb-1 font-semibold">E-mail</label>
                <input type="email" name="email" value="{{ user.email }}"
                       class="w-full bg-gray-900 border border-gray-700 text-white rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-red-500">
            </div>

            <!-- Avatar (opcional) -->
            <div>
                <label class="block text-gray-300 mb-2 font-semibold">Foto de Perfil</label>

                <div class="flex items-center space-x-4">
                    {% if user.perfil.foto %}
                        <img src="{{ user.perfil.foto.url }}" alt="avatar"
                             class="w-16 h-16 rounded-full border border-gray-600 object-cover">
                    {% else %}
                        <div class="w-16 h-16 flex items-center justify-center bg-gray-700 text-gray-400 rounded-full">
                            Sem foto
                        </div>
                    {% endif %}

                    <input type="file" name="foto" class="text-gray-300">
                </div>
            </div>

            <!-- Botão Salvar -->
            <button type="submit"
                class="w-full bg-red-600 hover:bg-red-700 transition-all p-3 rounded-lg text-white font-bold shadow-lg">
                Salvar alterações
            </button>
        </form>

        <div class="text-center mt-6">
            <a href="{% url 'filme:homepage' %}"
               class="text-gray-400 hover:text-gray-200 underline">
                Voltar para Home
            </a>
        </div>

    </div>

</div>

{% endblock %}
