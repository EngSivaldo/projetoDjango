{% load static %}

<nav id="mainNav"
     class="w-full flex justify-between items-center py-3 px-6 fixed top-0 z-50
            bg-gradient-to-b from-black/70 via-gray-900/70 to-black/70
            backdrop-blur-md shadow-lg transition-all duration-500 ease-in-out">

    <div class="flex items-center space-x-3">
        <a href="/" class="flex items-center space-x-2 group">
            <img class="w-12 sm:w-14 drop-shadow-lg transition-transform duration-300 group-hover:scale-110"
                 src="{% static 'images/preview.png' %}" alt="Logo Programação">
            <span class="text-red-600 text-2xl sm:text-3xl font-extrabold tracking-wide drop-shadow-md
                         group-hover:text-white transition-colors duration-300">
                Programação
            </span>
        </a>
    </div>

    <div class="flex items-center space-x-3">
          <div class="mr-2">
            {% if user.is_authenticated %}
            <form method="get" action="{% url 'filme:pesquisafilme' %}">

                <input type="text"
                       class="py-1 px-3 rounded-md text-black  focus:outline-none focus:ring-2 focus:ring-red-500" name="query"  value="{{ request.GET.query }}"
                    placeholder="Pesquisar...">
                <input type="submit" value="">
            </form>
           </div>
        {% endif %}
       <!--inicio Div de login-->
        <div class="mr-2">
        {% if user.is_authenticated %}
         <a href="{% url 'filme:login' %}"
           class="bg-red-600 hover:bg-red-700 text-white py-1 px-4 rounded-md shadow-md transition-all inline-block">
            Sair
        </a>
        {% else %}
       <a href="{% url 'filme:login' %}"
           class="bg-red-600 hover:bg-red-700 text-white py-1 px-4 rounded-md shadow-md transition-all inline-block">
            Login
        </a>
        {% endif %}
        </div>
        <!--fim Div de login-->

         <div class="mr-2">
             {% if user.is_authenticated %}
            <a href="#">
                <button class="bg-gray-800 hover:bg-gray-700 text-white py-1 px-4 rounded-md shadow-md transition-all">
                    Editar Perfil
                </button>
            </a>
              {% endif %}
         </div>
    </div>


</nav>

<script>
    const nav = document.getElementById('mainNav');
    let lastScroll = 0;

    window.addEventListener('scroll', () => {
        const currentScroll = window.scrollY;

        if (currentScroll <= 0) {
            nav.classList.remove('-translate-y-full', 'opacity-0');
            nav.classList.remove('bg-black/90', 'shadow-2xl');
            nav.classList.add('bg-gradient-to-b', 'from-black/70', 'via-gray-900/70', 'to-black/70', 'shadow-lg');
            return;
        }

        if (currentScroll > lastScroll && currentScroll > 150) {
            nav.classList.add('-translate-y-full', 'opacity-0');
        }
        else if (currentScroll < lastScroll) {
            nav.classList.remove('-translate-y-full', 'opacity-0');
            nav.classList.remove('bg-gradient-to-b', 'from-black/70', 'via-gray-900/70', 'to-black/70');
            nav.classList.add('bg-black/90', 'shadow-2xl');
        }

        lastScroll = currentScroll;
    });
</script>
