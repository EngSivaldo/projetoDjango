<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- importante para responsividade -->
    <title>
        {% block titulo %}Meu Site{% endblock %}
    </title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
          crossorigin="anonymous">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Bloco extra de cabeçalho (CSS adicional por página) -->
    {% block head %}{% endblock %}
</head>
<body class="bg-black text-gray-100 font-primary">

    <!-- Navbar -->
    {% include 'navbar.html' %}

    <!-- Conteúdo principal -->
    <main class="pt-20">
        {% block content %}
        {% endblock %}
    </main>


    <!-- Ícones -->
    <script type="module" src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@5.5.2/dist/ionicons/ionicons.js"></script>

</body>
</html>
